name: cicd

on:
  push:
    branches:
      - premium

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SKAFFOLD_DEFAULT_REPO: ghcr.io/con2
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - uses: pairity/setup-cd-tools@30acb848f9ff747aff4810dac40c5cc0971f485d
        with:
          skaffold: '1.20.0'
      - uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        run: |
          python3 -m pip install -U pip setuptools wheel
          python3 -m pip install emskaffolden
          emskaffolden -E staging -- build --file-output build.json
      - name: Store build.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-json
          path: build.json

  deploy:
    runs-on: qb-arc-runners
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/premium' }}
    steps:
      - uses: actions/checkout@v1
      - name: Get build.json from build step
        uses: actions/download-artifact@v4
        with:
          name: build-json
      - uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - uses: pairity/setup-cd-tools@30acb848f9ff747aff4810dac40c5cc0971f485d
        with:
          kubectl: '1.20.4'
          skaffold: '1.20.0'
      - run: |
          python3 -m pip install -U pip setuptools wheel
          python3 -m pip install emskaffolden
          emskaffolden -E con2 -- deploy -n tracontent-con2 -a build.json
          emskaffolden -E tracon -- deploy -n tracontent-tracon -a build.json
