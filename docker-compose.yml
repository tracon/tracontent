version: '2.2'
services:
  web:
    build: .
    init: true
    command: scripts/wait-for-it.sh postgres:5432 -- python manage.py docker_start
    ports:
      - 8001:8001
    links:
      - postgres
    volumes:
      - tracontent-media:/usr/src/app/media
      - .:/usr/src/app
    environment:
      PYTHONUNBUFFERED: 1
      DEBUG: 1
      DATABASE_URL: psql://tracontent:secret@postgres/tracontent
      TRACONTENT_SITE: ${TRACONTENT_SITE:-hitpoint2019}
      TRACONTENT_HOSTNAME: localhost
      CACHE_URL: memcache://memcache
      MINIO_BUCKET_NAME: tracontent
      MINIO_ACCESS_KEY_ID: tracontent
      MINIO_SECRET_ACCESS_KEY: tracontent
      MINIO_ENDPOINT_URL: http://minio:9000
  postgres:
    image: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: tracontent
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tracontent
  memcache:
    image: memcached
    init: true
  minio:
    image: minio/minio
    entrypoint: /usr/bin/env
    command: sh -c 'mkdir -p /data/tracontent && minio server /data --console-address ":9001"'
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: tracontent
      MINIO_ROOT_PASSWORD: tracontent
volumes:
  postgres-data: {}
  tracontent-media: {}
  minio-data: {}
