apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  selector:
    matchLabels:
      stack: tracontent
      component: nginx
  template:
    metadata:
      labels:
        stack: tracontent
        component: nginx
    spec:
      enableServiceLinks: false
      containers:
        - name: master
          image: !Var tracontent_static_image
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /etc/nginx/conf.d
              name: config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nginx
